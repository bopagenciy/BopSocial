# Social Stats — single-origin nginx for the docker-compose stack.
# Serves the React build and proxies API + WebSockets + media to the
# backend service (service name "backend" on the compose network).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    # API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSockets (Channels)
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Uploaded public branding assets (logos, avatars)
    location /media/logos/ {
        alias /srv/media/logos/;
        expires 7d;
    }

    location /media/avatars/ {
        alias /srv/media/avatars/;
        expires 7d;
    }

    # Protected internal media location for X-Accel-Redirect (cannot be accessed directly)
    location /internal_media/ {
        internal;
        alias /srv/media/;
    }

    # Private media assets — enforce request-time authorization via Django (SEC-01)
    location /media/media_assets/ {
        proxy_pass http://backend:8000/api/media/serve-legacy/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed static assets — cache hard
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
